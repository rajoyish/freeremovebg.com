name = "freeremovebg"
compatibility_date = "2025-06-01"
main = "./worker/index.js"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "freeremovebg.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"

not_found_handling = "404-page"

run_worker_first = ["/", "/api/count", "/api/upload-temp", "/api/edge-status"]

# Global cutout counter.
[[d1_databases]]
binding = "DB"
database_name = "freeremovebg_stats"
database_id = "c87ac39c-e41a-4232-b166-d5639c62442a"

# Temporary uploads for the /convert and /optimize edge pipeline
# (worker/upload.js). Create the bucket BEFORE deploying this binding, or the
# deploy fails: `wrangler r2 bucket create freeremovebg-temp`. Setup steps,
# including the public custom domain and the 1-day lifecycle rule, are in
# DEVELOPMENT.md under "Image converter & optimizer".
[[r2_buckets]]
binding = "TEMP_BUCKET"
bucket_name = "freeremovebg-temp"

[vars]
# Public custom domain connected to the bucket above. It must be on this zone
# so /cdn-cgi/image/ accepts it as a source without an allow-list. Leave empty
# to keep the edge off: every image is then encoded in the browser.
TEMP_PUBLIC_URL = "https://temp.freeremovebg.com"

# Uploads allowed per calendar month (UTC) before the edge pauses until the
# 1st, counted in D1 by worker/edgeBudget.js. The free plan includes 5,000
# unique transformations; this leaves headroom. Set it to "0" to keep every
# image on the device, or raise it after moving to a paid Images plan.
EDGE_MONTHLY_BUDGET = "4900"

# Per-IP upload throttle for /api/upload-temp (worker/upload.js answers 429
# past it, and the client then encodes on the device). 60 uploads a minute
# covers a fast batch in the optimizer, which runs three at a time.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
