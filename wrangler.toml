name = "freeremovebg"
compatibility_date = "2025-06-01"
main = "./worker/index.js"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "freeremovebg.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"

not_found_handling = "404-page"

run_worker_first = ["/", "/api/count"]

# Global cutout counter.
[[d1_databases]]
binding = "DB"
database_name = "freeremovebg_stats"
database_id = "c87ac39c-e41a-4232-b166-d5639c62442a"